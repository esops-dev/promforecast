{{- if .Values.prometheusRules.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "promforecast-stack.fullname" . }}-rules
  labels:
{{- include "promforecast-stack.labels" . | nindent 4 }}
{{- range $k, $v := .Values.prometheusRules.labels }}
    {{ $k }}: {{ $v | quote }}
{{- end }}
spec:
  groups:
    - name: promforecast.operational
      interval: 1m
      rules:
        - alert: ForecastStale
          expr: time() - forecast_last_run_timestamp_seconds > 7200
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "promforecast hasn't refreshed group {{`{{ $labels.group }}`}} in over 2h"
            description: |
              The forecaster has not produced a successful run for group
              {{`{{ $labels.group }}`}} in over 2 hours. Check pod logs and
              datasource availability.

        - alert: ForecastSeriesStale
          expr: forecast_data_staleness_seconds > 14400
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Forecast {{`{{ $labels.id }}`}} model {{`{{ $labels.model }}`}} on {{`{{ $labels.instance }}`}} hasn't been refit for >4h"
            description: |
              The (series, model) tuple for {{`{{ $labels.id }}`}} on group
              {{`{{ $labels.group }}`}} hasn't produced a successful forecast
              for over four hours. The group-level ForecastStale alert stays
              quiet because other series in the group are still being fit
              successfully; this rule catches the silent per-series failure
              (model crash, persistent fit timeout, data gap that drops the
              series under min_points).

        - alert: ForecastModelDegraded
          expr: forecast_accuracy_mape > 30
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: "Forecast accuracy degraded for {{`{{ $labels.id }}`}} (MAPE > 30%)"
            description: |
              Backtest MAPE for {{`{{ $labels.id }}`}} model {{`{{ $labels.model }}`}}
              at horizon {{`{{ $labels.horizon }}`}} has exceeded 30% for 24h.

        - alert: ForecastModelDegradedMASE
          expr: forecast_accuracy_mase > 1.0
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: "Forecast MASE > 1.0 for {{`{{ $labels.id }}`}} — worse than seasonal naive"
            description: |
              Backtest MASE for {{`{{ $labels.id }}`}} model {{`{{ $labels.model }}`}}
              at horizon {{`{{ $labels.horizon }}`}} has exceeded 1.0 for 24h —
              the forecast is doing no better than a seasonal naive baseline.

        - alert: ForecastFallbackPersistent
          expr: count by (group) (forecast_quality_score{model_fallback="true", horizon=""}) > 0
          for: 6h
          labels:
            severity: info
          annotations:
            summary: "Auto-select keeps falling back for group {{`{{ $labels.group }}`}}"
            description: |
              At least one series in {{`{{ $labels.group }}`}} has been falling
              back to the configured fallback model for 6h.

        - alert: ForecastQualityLow
          expr: |
            avg by (group) (forecast_quality_score{cold_start!="true", horizon=""}) < 0.4
          for: 6h
          labels:
            severity: info
          annotations:
            summary: "Average forecast quality for group {{`{{ $labels.group }}`}} is low"
            description: |
              Average forecast_quality_score for group {{`{{ $labels.group }}`}}
              (excluding cold-start fits) is below 0.4 for 6h. Treat
              downstream forecast-based alerts with caution.

        - alert: ForecastQualityZero
          expr: forecast_quality_score{cold_start!="true", horizon=""} == 0
          for: 1h
          labels:
            severity: info
          annotations:
            summary: "Forecast quality is 0 for {{`{{ $labels.id }}`}} ({{`{{ $labels.model }}`}})"
            description: |
              forecast_quality_score for {{`{{ $labels.id }}`}}
              ({{`{{ $labels.model }}`}}) has been zero for 1h. Check
              data coverage and band width.

        - alert: ForecastColdStartSiblingsLow
          expr: forecast_cold_start_siblings < 3
          for: 30m
          labels:
            severity: info
          annotations:
            summary: "Cold-start siblings thinning for {{`{{ $labels.group }}`}}/{{`{{ $labels.query }}`}}"
            description: |
              The cold-start borrow query for
              {{`{{ $labels.group }}`}}/{{`{{ $labels.query }}`}} has fewer than
              3 usable siblings for 30m. Check whether peer renames or
              label-cardinality drift have thinned the borrow set.

    - name: promforecast.deviation
      interval: 1m
      rules:
        - alert: ForecastDeviation
          expr: |
            forecast_deviation_outside_band == 1
            and on (id, group, model) forecast_quality_score{horizon=""} > 0.6
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Actual {{`{{ $labels.id }}`}} is outside its forecast band"
            description: |
              {{`{{ $labels.id }}`}} (group {{`{{ $labels.group }}`}}, model
              {{`{{ $labels.model }}`}}, level {{`{{ $labels.level }}`}}) has been
              outside its forecast confidence band for 15m.

        - alert: ForecastDeviationSevere
          expr: |
            abs(forecast_deviation_ratio) > 2
            and on (id, group, model) forecast_quality_score{horizon=""} > 0.6
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Actual {{`{{ $labels.id }}`}} is far outside its forecast band"
            description: |
              {{`{{ $labels.id }}`}} (group {{`{{ $labels.group }}`}}, model
              {{`{{ $labels.model }}`}}, level {{`{{ $labels.level }}`}}) has a
              deviation ratio with magnitude above 2 for 5m.

# Capacity-planning alerts live only in examples/alerts/promforecast-rules.yaml
# under the ``promforecast.capacity.examples`` group. They are
# environment-specific templates (filesystem/CPU metric names, thresholds)
# that the chart deliberately does not bundle — the drift check in
# .github/workflows/ci.yml excludes any group whose name ends with
# ``.examples`` from the chart-vs-example comparison precisely so those
# operator-tunable templates can live in one place. Add operational alerts
# (no metric/env assumptions) to the groups above so they ship in both.
{{- end }}
