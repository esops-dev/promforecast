apiVersion: v2
name: promforecast-stack
description: VictoriaMetrics + promforecast + dashboards in a single install.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.27.0-0"
home: https://github.com/esops-dev/promforecast
sources:
  - https://github.com/esops-dev/promforecast
keywords:
  - prometheus
  - forecasting
  - victoriametrics
  - monitoring
maintainers:
  - name: esops-dev
    url: https://github.com/esops-dev
icon: https://raw.githubusercontent.com/esops-dev/promforecast/main/docs/assets/logo.png
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: monitoring

dependencies:
  - name: victoria-metrics-single
    repository: https://victoriametrics.github.io/helm-charts/
    version: ~0.12.0
    condition: victoria-metrics-single.enabled

  - name: promforecast
    repository: file://../promforecast
    version: 0.1.0
    condition: promforecast.enabled
