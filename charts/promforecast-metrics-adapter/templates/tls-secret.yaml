{{- if and .Values.tls.generate (not .Values.tls.existingSecret) -}}
{{- $tls := include "promforecast-metrics-adapter.tlsMaterial" . | fromYaml -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "promforecast-metrics-adapter.tlsSecretName" . }}
  labels:
    {{- include "promforecast-metrics-adapter.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $tls.cert | b64enc }}
  tls.key: {{ $tls.key | b64enc }}
  ca.crt: {{ $tls.ca | b64enc }}
{{- end }}
