# Default values for promforecast.
# Single-replica by default. Multi-replica HA mode requires
# `highAvailability.enabled: true` and a Redis backend.

image:
  repository: ghcr.io/esops-dev/promforecast
  tag: ""           # defaults to the chart appVersion
  pullPolicy: IfNotPresent
  pullSecrets: []

# Single replica is intentional — the in-process scheduler is per-process.
# Set highAvailability.enabled to opt into leader election + Redis cache.
replicaCount: 1
strategy:
  type: Recreate

highAvailability:
  enabled: false
  redis:
    address: ""     # e.g. redis-master.redis.svc:6379
    existingSecret: ""
    secretKey: password

# Forecaster YAML config. Either inline below, or set existingConfigMap.
existingConfigMap: ""
config:
  # Schema version. The forecaster routes on this string and warns when
  # it is missing. ``promforecast.io/v1`` is the stable schema;
  # ``promforecast.io/v1alpha1`` still loads (with a DeprecationWarning)
  # for configs predating the stable cut-over. See docs/reference/config-schema.md
  # for the deprecation policy.
  apiVersion: promforecast.io/v1

  datasource:
    url: http://victoria-metrics-single-server:8428/
    timeout: 30s
    auth:
      type: none
    # In-flight PromQL request cap. The forecaster shares this client
    # across every group's queries + per-query regressor fan-out, so a
    # large fan-out can stack up requests against the TSDB. Default 8 is
    # comfortable for a single-replica forecaster against a single-node
    # VictoriaMetrics; tune up if you observe queueing, tune down for a
    # shared TSDB that's rate-sensitive.
    max_concurrent_requests: 8
    # httpx pool sizing — kept in lockstep with max_concurrent_requests
    # by default so the semaphore is the only bottleneck. Lower the
    # keepalive count if your TSDB closes idle connections aggressively.
    max_keepalive_connections: 8

  server:
    listen: ":9091"
    refresh_interval: 1h
    reload:
      enabled: true
      watch_configmap: true
    # Off by default. Flip to true to expose a sanitised JSON view of the
    # parsed config + its SHA-256 hash on `GET /config`. Useful for
    # confirming "what is this pod actually running?" without `kubectl
    # exec`. The endpoint is unauthenticated like /metrics, so only
    # enable it when the metrics port is on a trusted network.
    expose_config_endpoint: false
    # Off by default. Flip to true to expose `POST /forecast/what-if/fleet`
    # which runs the preview machinery across every query whose
    # `thresholds:` define a capacity ceiling and returns a ranked list
    # of services projected to breach soonest under a hypothetical
    # traffic multiplier. The endpoint is throttled by
    # `safety.fleet_what_if_min_interval` so polling dashboards can't
    # starve scheduled fits. Same network-level access-control model as
    # /metrics and /-/reload.
    expose_what_if_endpoint: false

  safety:
    max_series_per_query: 500
    max_total_series: 5000
    series_overflow: drop_lowest_priority
    fit_timeout: 60s
    query_timeout: 30s
    # Minimum interval between successive fleet what-if runs. The
    # endpoint refits every threshold-bearing query against the
    # requested traffic multiplier; a single invocation is O(minutes)
    # on a medium config so unthrottled access would starve scheduled
    # fits. The default of 5m matches a typical `refresh_interval`.
    # Has no effect unless `server.expose_what_if_endpoint` is true.
    fleet_what_if_min_interval: 5m

  defaults:
    lookback: 14d
    step: 5m
    horizon: 24h
    # Models can be plain names, or `{ name: ..., params: ... }` for power
    # users who want to override individual model hyperparameters. Both
    # forms can be mixed in the same list.
    models: [AutoARIMA, SeasonalNaive]
    season_length: 288
    confidence_levels: [80, 95]
    min_points: 200
    accuracy:
      evaluate: true
      horizons: [1h, 6h, 24h]
      # `false` (default) | `true` (single winner) | `ensemble` (weighted
      # combo of every configured model, plus the components).
      auto_select: false
      fallback_model: SeasonalNaive
      fallback_mape_threshold: 50
    emission:
      deviation: true
      quality: true
      # Per-regressor explainability share, emitted as
      # `<id>_forecast_contribution_ratio{regressor=...}`. No-op when a
      # query has no regressors configured; otherwise one sample per
      # series-regressor whose values sum to 1 across regressors.
      contribution: true

  # Optional remote_write sink: writes the *full* forecast curve to a TSDB
  # with future timestamps. The /metrics exporter remains the pull default
  # and is unaffected. Requires a TSDB that accepts forward-dated samples
  # (VictoriaMetrics with -futureRetention=2d, Mimir, Thanos receive). The
  # default endpoint shape targets VictoriaMetrics' text-import endpoint.
  sink:
    remote_write:
      enabled: false
      url: ""    # e.g. http://victoriametrics:8428/api/v1/import/prometheus
      timeout: 30s
      # Rows per HTTP request body. Default keeps each POST well under the
      # typical TSDB ingest cap; tighten for shops behind aggressive
      # ingress proxies or when push latency matters.
      chunk_size: 10000
      headers: {}
      # HTTP pool sizing for the push client. The sink is shared across
      # groups and groups push concurrently when their refresh intervals
      # overlap; increase max_connections when many groups are
      # configured so concurrent pushes don't queue on the pool. Lower
      # the keepalive count if your TSDB closes idle connections
      # aggressively (e.g. fronted by an HTTP proxy).
      max_connections: 4
      max_keepalive_connections: 2

  # High-availability runtime configuration. The chart's top-level
  # `highAvailability` block controls Kubernetes-side wiring (RBAC, env
  # vars from the downward API). The block below is the forecaster's
  # runtime view of the same settings — both must agree to take effect.
  # `helm install` populates the forecaster fields from the chart fields
  # automatically, so operators usually only edit the top-level chart
  # values. Override the inner block when you need to point the elector
  # at a different Lease name (e.g. multi-tenant clusters).
  highAvailability:
    enabled: false
    lease_name: promforecast-leader
    # Namespace + identity default to the values projected via the
    # downward API (PROMFORECAST_NAMESPACE / PROMFORECAST_POD_NAME).
    namespace: ""
    identity: ""
    lease_duration_seconds: 30
    renew_deadline_seconds: 20
    retry_period_seconds: 4
    redis:
      address: ""
      password: ""
      snapshot_ttl: 5m

  # Optional OpenTelemetry tracing. Disabled by default; flip
  # `telemetry.enabled` and set an `otlp.endpoint` to ship traces of the
  # query → fit → export pipeline to an OTel Collector. The Docker image
  # bakes the OTel SDK in by default — no rebuild needed when enabling.
  # When disabled the SDK is *not* imported, so this section is genuinely
  # zero-overhead in single-replica low-traffic deployments.
  telemetry:
    enabled: false
    service_name: promforecast
    sample_ratio: 1.0
    otlp:
      endpoint: ""        # e.g. otel-collector.monitoring.svc:4317
      insecure: true
      headers: {}
      timeout: 10s

  # PromQL query-result cache. Off by default; enable when two or more
  # groups query the same TSDB endpoint with overlapping PromQL prefixes
  # so the duplicate fetches collapse into one. The TTL controls how
  # stale a cached result can be — keep it well below refresh_interval
  # so each refresh tick still gets fresh data, but high enough that
  # cross-group overlap actually hits.
  query_cache:
    enabled: false
    # `auto` resolves to `redis` when highAvailability.enabled is true,
    # `memory` otherwise. Force one or the other when the auto rule
    # doesn't match your topology.
    backend: auto
    ttl: 5m
    # In-memory LRU size cap (entries, not bytes). Ignored when the
    # backend resolves to redis.
    max_entries: 1024
    # Optional standalone Redis (when not reusing the HA Redis). Leave
    # empty when highAvailability.redis.address is set — the HA client
    # is reused automatically.
    redis_address: ""
    redis_password: ""

  groups: []

service:
  type: ClusterIP
  port: 9091
  annotations: {}

serviceMonitor:
  enabled: false
  namespace: ""
  interval: 60s
  scrapeTimeout: 30s
  labels: {}
  relabelings: []
  metricRelabelings: []
  # Drop the forecast snapshot gauges (``*_forecast``, ``*_forecast_lower``,
  # ``*_forecast_upper``) from the scrape when the remote_write sink is on.
  # The sink pushes the full forecast curve into the TSDB directly with
  # native future timestamps; the scraped snapshot is a duplicate carrying a
  # different labelset (``instance="<forecaster-pod>:9091"``,
  # ``job="<release>"``) that dashboards either average across or have to
  # pre-filter. Default ``null`` resolves to ``true`` when
  # ``sink.remote_write.enabled`` is true, ``false`` otherwise — so the
  # default install never ends up in the dual-source state. Set explicitly
  # to ``false`` to override and keep both copies (rare; useful only when
  # the snapshot end-of-horizon gauges are wanted alongside the curves).
  # Operational ``forecast_*`` metrics (``forecast_quality_score``,
  # ``forecast_failures_total``, etc.) are unaffected — only the
  # ``*_forecast`` / ``*_forecast_lower`` / ``*_forecast_upper`` families
  # are dropped.
  #
  # **Edge case for ``existingConfigMap``**: the chart cannot inspect the
  # sink setting inside an out-of-band ConfigMap, so the ``null``
  # derivation falls through to ``false``. If you use ``existingConfigMap``
  # AND the external config has ``sink.remote_write.enabled: true``, pin
  # ``dropForecastSnapshots: true`` here explicitly — otherwise the
  # snapshot copy stays scraped alongside the sink push and you end up in
  # the dual-source state.
  dropForecastSnapshots: null

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  # Required when highAvailability.enabled is true (Lease API).
  create: true

networkPolicy:
  enabled: false
  egress: []
  # When highAvailability is on the chart adds Redis + kube-apiserver
  # egress rules automatically. Override these only if your Redis runs
  # on a non-default port or your API server is exposed on something
  # other than 443/6443.
  redisPort: 6379
  kubeApiPort: 443

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

extraEnv: []
extraVolumes: []
extraVolumeMounts: []

# ``helm test`` hooks. Each hook below renders as a one-shot Pod that
# the operator runs with ``helm test <release>``; nothing is created
# during the normal ``helm install`` apply, so the production install
# does not pay any test-pod resource cost. Disable a hook to suppress
# the corresponding rendered template entirely.
tests:
  # ``validateConfig`` runs ``promforecast validate --strict-cardinality``
  # against the mounted config. The strict flag flips the projected
  # cardinality overshoot from an advisory ``WARN`` line into a hard
  # fail, so an operator using a wrapper like ArgoCD's PostSync hook
  # can reject changes that would blow the global series cap before the
  # forecaster pod ingests them. See docs/operations/cardinality.md for
  # the workflow.
  validateConfig:
    enabled: true
