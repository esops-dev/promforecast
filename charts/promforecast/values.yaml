# Default values for promforecast.
# Single-replica by default. Multi-replica HA mode requires
# `highAvailability.enabled: true` and a Redis backend.

image:
  repository: ghcr.io/esops-dev/promforecast
  tag: ""           # defaults to the chart appVersion
  pullPolicy: IfNotPresent
  pullSecrets: []

# Single replica is intentional — the in-process scheduler is per-process.
# Set highAvailability.enabled to opt into leader election + Redis cache.
replicaCount: 1
strategy:
  type: Recreate

highAvailability:
  enabled: false
  redis:
    address: ""     # e.g. redis-master.redis.svc:6379
    existingSecret: ""
    secretKey: password

# Forecaster YAML config. Either inline below, or set existingConfigMap.
existingConfigMap: ""
config:
  datasource:
    url: http://victoria-metrics-single-server:8428/
    timeout: 30s
    auth:
      type: none

  server:
    listen: ":9091"
    refresh_interval: 1h
    reload:
      enabled: true
      watch_configmap: true
    # Off by default. Flip to true to expose a sanitised JSON view of the
    # parsed config + its SHA-256 hash on `GET /config`. Useful for
    # confirming "what is this pod actually running?" without `kubectl
    # exec`. The endpoint is unauthenticated like /metrics, so only
    # enable it when the metrics port is on a trusted network.
    expose_config_endpoint: false

  safety:
    max_series_per_query: 500
    max_total_series: 5000
    series_overflow: drop_lowest_priority
    fit_timeout: 60s
    query_timeout: 30s

  defaults:
    lookback: 14d
    step: 5m
    horizon: 24h
    # Models can be plain names, or `{ name: ..., params: ... }` for power
    # users who want to override individual model hyperparameters. Both
    # forms can be mixed in the same list.
    models: [AutoARIMA, SeasonalNaive]
    season_length: 288
    confidence_levels: [80, 95]
    min_points: 200
    accuracy:
      evaluate: true
      horizons: [1h, 6h, 24h]
      # `false` (default) | `true` (single winner) | `ensemble` (weighted
      # combo of every configured model, plus the components).
      auto_select: false
      fallback_model: SeasonalNaive
      fallback_mape_threshold: 50
    emission:
      deviation: true
      quality: true
      # Per-regressor explainability share, emitted as
      # `<id>_forecast_contribution_ratio{regressor=...}`. No-op when a
      # query has no regressors configured; otherwise one sample per
      # series-regressor whose values sum to 1 across regressors.
      contribution: true

  # Optional remote_write sink: writes the *full* forecast curve to a TSDB
  # with future timestamps. The /metrics exporter remains the pull default
  # and is unaffected. Requires a TSDB that accepts forward-dated samples
  # (VictoriaMetrics with -futureRetention=2d, Mimir, Thanos receive). The
  # default endpoint shape targets VictoriaMetrics' text-import endpoint.
  sink:
    remote_write:
      enabled: false
      url: ""    # e.g. http://victoriametrics:8428/api/v1/import/prometheus
      timeout: 30s
      # Rows per HTTP request body. Default keeps each POST well under the
      # typical TSDB ingest cap; tighten for shops behind aggressive
      # ingress proxies or when push latency matters.
      chunk_size: 10000
      headers: {}

  groups: []

service:
  type: ClusterIP
  port: 9091
  annotations: {}

serviceMonitor:
  enabled: false
  namespace: ""
  interval: 60s
  scrapeTimeout: 30s
  labels: {}
  relabelings: []
  metricRelabelings: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  # Required when highAvailability.enabled is true (Lease API).
  create: true

networkPolicy:
  enabled: false
  egress: []

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

extraEnv: []
extraVolumes: []
extraVolumeMounts: []
