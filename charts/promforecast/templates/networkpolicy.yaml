{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "promforecast.fullname" . }}
  labels: {{- include "promforecast.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "promforecast.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: http
          protocol: TCP
  egress:
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- /*
        HA mode talks to the Kubernetes API server (Lease coordination) and
        to Redis (snapshot cache, optional query cache). The kube-apiserver
        is reachable via the kubernetes.default.svc Service, which routes to
        a host-network endpoint on the control plane — we authorise port
        443/6443 to any pod-network destination since we can't enumerate the
        endpoint IPs from a chart. Redis traffic is constrained to the
        configured port (default 6379); operators with a non-default Redis
        port can override via networkPolicy.redisPort.
    */}}
    {{- /*
        leader_assigned sharding has the same egress needs as HA: the Lease
        API on the kube-apiserver plus Redis (membership registry +
        assignment). consistent_hash sharding needs neither — its egress is
        just DNS + the TSDB (covered by networkPolicy.egress).
    */}}
    {{- $needsCoordEgress := or .Values.highAvailability.enabled (and .Values.sharding.enabled (eq .Values.sharding.mode "leader_assigned")) }}
    {{- if $needsCoordEgress }}
    - to:
        - namespaceSelector: {}
      ports:
        - port: {{ .Values.networkPolicy.redisPort | default 6379 }}
          protocol: TCP
    - ports:
        - port: {{ .Values.networkPolicy.kubeApiPort | default 443 }}
          protocol: TCP
        - port: 6443
          protocol: TCP
    {{- end }}
{{- end }}
