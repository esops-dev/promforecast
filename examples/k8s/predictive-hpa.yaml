# Example: predictive HPA scaling on a promforecast forecast metric.
#
# The HPA references the external metric ``rps-forecast`` — the
# metric name as registered with the promforecast-metrics-adapter
# (see the adapter chart's ``metrics:`` array). The forecast value
# is delivered to HPA via the Kubernetes custom-metrics API
# aggregator; the adapter resolves it by querying VictoriaMetrics.
#
# **Quality gate.** A bad forecast can produce a runaway scale-up
# or scale-down recommendation. Pair the predictive metric with a
# ``forecast_quality_score`` gate so the HPA only acts when the
# underlying forecast is trustworthy. The conventional pattern is a
# second HPA scaling on a different signal as a fallback (e.g. raw
# CPU) so the predictive HPA is the primary and the reactive HPA is
# the safety net.
#
# **Stabilization window.** The ``behavior.scaleDown.stabilizationWindowSeconds``
# is set deliberately wide (10 minutes) so a transient bad forecast
# doesn't cause a flap. Predictive scaling is a "scale up early,
# scale down slowly" workflow — the standard scaling-policy defaults
# bias the wrong way for a predictive signal.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payments-api-predictive
  namespace: payments
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payments-api
  minReplicas: 3
  maxReplicas: 30
  metrics:
    # Primary: predictive forecast metric. The HPA target value is
    # in the same units as the underlying forecast — e.g. if the
    # forecast is requests-per-second per pod, set the target to
    # the desired RPS-per-pod.
    - type: External
      external:
        metric:
          name: rps-forecast
          selector:
            matchLabels:
              service: payments-api
        target:
          type: AverageValue
          averageValue: "50"
  behavior:
    scaleUp:
      # Scale up promptly — the whole point of predictive scaling is
      # to provision capacity before the spike arrives.
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 4
          periodSeconds: 30
        - type: Percent
          value: 50
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      # Scale down slowly. A transient bad forecast that
      # under-projects load briefly should not cause the HPA to
      # drop pods.
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min
