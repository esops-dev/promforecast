# These example rules assume the sink+VM emission path: the forecaster's
# ``sink.remote_write`` is on and the ``*_forecast`` / ``*_forecast_lower``
# / ``*_forecast_upper`` snapshot families have been dropped from the
# Prometheus scrape (the umbrella chart and the standalone chart's
# ``serviceMonitor.dropForecastSnapshots`` default this on whenever the
# sink is enabled). Under that path forecast curves carry only their
# source labels (``instance``, ``device``, etc.) — no
# ``instance="<forecaster-pod>:9091"`` and no ``job="promforecast"`` —
# so the expressions below filter purely on source-side labels. See
# ``docs/reference/emission-paths.md`` for the two-path picture and
# the scrape-drop snippet for an externally-managed Prometheus.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: promforecast-rules
  labels:
    role: alert-rules
    app.kubernetes.io/part-of: promforecast
spec:
  groups:
    - name: promforecast.operational
      interval: 1m
      rules:
        # Forecaster has not produced a successful run in over 2h.
        - alert: ForecastStale
          expr: time() - forecast_last_run_timestamp_seconds > 7200
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "promforecast hasn't refreshed group {{ $labels.group }} in over 2h"
            description: |
              The forecaster has not produced a successful run for group
              {{ $labels.group }} in over 2 hours. Check pod logs and
              datasource availability.

        # Per-series complement to ForecastStale above. The group-level
        # gauge keeps ticking as long as *any* series of the group is
        # fit successfully, so a single series whose model crashes
        # silently is invisible there. ``forecast_data_staleness_seconds``
        # tracks the per-(series, model) clock so the silent failure
        # surfaces — alert when staleness exceeds four refresh cycles
        # (≈ four hours at the default 1h refresh).
        - alert: ForecastSeriesStale
          expr: forecast_data_staleness_seconds > 14400
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              Forecast {{ $labels.id }} model {{ $labels.model }} on
              {{ $labels.instance }} hasn't been refit for >4h
            description: |
              The (series, model) tuple for {{ $labels.id }} on group
              {{ $labels.group }} hasn't produced a successful forecast
              for over four hours. The group-level ForecastStale alert
              stays quiet because other series in the group are still
              being fit successfully; this rule catches the silent
              per-series failure (model crash, persistent fit timeout,
              data gap that drops the series under min_points). Check
              the forecaster logs filtered by group + query, then by
              the source-side labels carried on the staleness gauge.

        # Backtest accuracy has degraded — model needs retraining or
        # replacement. Threshold is intentionally loose; tune for the SLOs
        # of the metrics being forecasted.
        - alert: ForecastModelDegraded
          expr: forecast_accuracy_mape > 30
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: "Forecast accuracy degraded for {{ $labels.id }} (MAPE > 30%)"
            description: |
              Backtest MAPE for {{ $labels.id }} model {{ $labels.model }}
              at horizon {{ $labels.horizon }} has exceeded 30% for 24h.
              Consider retraining, switching models, or extending the
              lookback window.

        # Parallel rule for intermittent / count-shaped series. MAPE
        # is undefined wherever the actual is zero, so the rule above
        # silently never fires for these series; MASE > 1.0 means the
        # forecast is doing worse than a seasonal naive baseline.
        - alert: ForecastModelDegradedMASE
          expr: forecast_accuracy_mase > 1.0
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: "Forecast MASE > 1.0 for {{ $labels.id }} — worse than seasonal naive"
            description: |
              Backtest MASE for {{ $labels.id }} model {{ $labels.model }}
              at horizon {{ $labels.horizon }} has exceeded 1.0 for 24h —
              the forecast is doing no better than a seasonal naive
              baseline. Particularly useful for intermittent / count
              series where MAPE is undefined wherever the actual is zero.

        # The exporter keeps falling back to the configured fallback model,
        # which means the configured `models:` list isn't a good fit for
        # this data. Symptom of mis-configuration, not an outage.
        # Cold-start fits are excluded for the same reason as the quality
        # rules below: cold-start routinely engages the fallback while the
        # model adapts, so including them would mask configured-models
        # failures and noisily flag healthy cold-start ramps.
        - alert: ForecastFallbackPersistent
          expr: |
            count by (group) (
              forecast_quality_score{model_fallback="true", cold_start!="true"}
            ) > 0
          for: 6h
          labels:
            severity: info
          annotations:
            summary: "Auto-select keeps falling back for group {{ $labels.group }}"
            description: |
              At least one steady-state series in {{ $labels.group }} has
              been falling back to the configured fallback model for 6h.
              The configured models are likely a poor fit for this data.

        # Persistently low quality across a group: forecasts shouldn't be
        # trusted for alerting. Tune the threshold; 0.4 is a useful default.
        # Cold-start fits are excluded because their quality score is
        # capped at ``cold_start.max_quality_score`` (default 0.5) by
        # design — they would otherwise drag the per-group average and
        # noisily trip this alert until the underlying series matures.
        - alert: ForecastQualityLow
          expr: |
            avg by (group) (forecast_quality_score{cold_start!="true"}) < 0.4
          for: 6h
          labels:
            severity: info
          annotations:
            summary: "Average forecast quality for group {{ $labels.group }} is low"
            description: |
              Average forecast_quality_score for group {{ $labels.group }}
              (excluding cold-start fits) is below 0.4 for 6h. Treat
              downstream forecast-based alerts with caution and
              investigate model fit, band width, and data coverage.

        # Quality score is composed multiplicatively from MAPE / band /
        # coverage; if it sticks at zero for a single series for hours,
        # the inputs are likely degenerate (no MAPE, all-zero data).
        # Excludes cold-start: those scores can land at a configured
        # ``max_quality_score`` and are not a model-degradation signal.
        - alert: ForecastQualityZero
          expr: forecast_quality_score{cold_start!="true"} == 0
          for: 1h
          labels:
            severity: info
          annotations:
            summary: "Forecast quality is 0 for {{ $labels.id }} ({{ $labels.model }})"
            description: |
              forecast_quality_score for {{ $labels.id }}
              ({{ $labels.model }}) has been zero for 1h. The model is
              likely producing meaningless output for this series; check
              data coverage and band width.

        # Cold-start sibling headroom is thinning. The configured
        # ``min_siblings`` is the contract; once the gauge drops below
        # the threshold the next cold-start fit will silently fall
        # through to the standard min_points drop. Catch the early
        # warning here so operators can fix the borrow query before the
        # forecast disappears.
        - alert: ForecastColdStartSiblingsLow
          expr: forecast_cold_start_siblings < 3
          for: 30m
          labels:
            severity: info
          annotations:
            summary: "Cold-start siblings thinning for {{ $labels.group }}/{{ $labels.query }}"
            description: |
              The cold-start borrow query for
              {{ $labels.group }}/{{ $labels.query }} has fewer than 3
              usable siblings for 30m. Once the count drops below
              ``min_siblings`` the cold-start path stops emitting and
              short series fall back to the standard min_points drop —
              check whether peer renames or label-cardinality drift
              have thinned the borrow set.

    - name: promforecast.deviation
      interval: 1m
      rules:
        # Anomaly-detection signal: the actual is outside its forecast
        # band. Gated on quality so poor forecasts don't fire false
        # positives. Tune `for:` and the quality threshold to your noise
        # tolerance.
        # Pinned to ``level="95"`` (the conservative band) so the rule
        # fires once per series when the actual leaves *that* band, not
        # twice — once for the 80% band and again for the 95%. The
        # ``forecast_deviation_outside_band`` metric carries a ``level``
        # label that ``forecast_quality_score`` does not, so without
        # pinning, the join's right-hand side would bind both 80% and
        # 95% rows of the same series and Alertmanager would receive
        # two distinct alerts for one incident.
        - alert: ForecastDeviation
          expr: |
            forecast_deviation_outside_band{level="95"} == 1
            and on (id, group, model) forecast_quality_score > 0.6
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Actual {{ $labels.id }} is outside its 95% forecast band"
            description: |
              {{ $labels.id }} (group {{ $labels.group }}, model
              {{ $labels.model }}) has been outside its 95% forecast
              confidence band for 15m. Quality score for this series is
              above 0.6, so the deviation is likely meaningful.

        # Stronger signal: actual is far outside the band (|ratio| > 2 means
        # it's a full band-width past the edge). Good candidate for paging.
        # Pinned to ``level="95"`` for the same reason as ``ForecastDeviation``
        # above: the metric carries ``level`` and a naive join would fire
        # twice per series.
        - alert: ForecastDeviationSevere
          expr: |
            abs(forecast_deviation_ratio{level="95"}) > 2
            and on (id, group, model) forecast_quality_score > 0.6
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Actual {{ $labels.id }} is far outside its 95% forecast band"
            description: |
              {{ $labels.id }} (group {{ $labels.group }}, model
              {{ $labels.model }}) has a deviation ratio with magnitude
              above 2 for 5m. The actual is well past the edge of the
              high-confidence forecast band.

    - name: promforecast.capacity.examples
      interval: 5m
      rules:
        # Replace the metric and threshold with your own; this is a
        # template — do not deploy as-is without tuning. The
        # ``<id>_forecast`` snapshot value is the *end-of-horizon*
        # forecast (carrying ``horizon="next"``, which means "the next
        # snapshot value to be served") — see ``docs/reference/models.md`` for
        # the convention. If ``defaults.horizon: 24h`` is the configured
        # forecast horizon then this alert reads "the disk is forecast
        # to be empty 24h from now".
        - alert: NodeFilesystemForecastedFull
          expr: node_filesystem_avail_bytes_forecast < 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }}:{{ $labels.mountpoint }} forecast to fill before horizon"
            description: |
              The end-of-horizon forecast for free space on
              {{ $labels.instance }} ({{ $labels.mountpoint }}) is below
              zero. Provision capacity or clean up.

        # Alert on the time-to-threshold ETA family directly.
        # Read against the conservative band (``level="95"``) so the
        # alert fires for "will hit threshold within N hours at 95%
        # confidence" rather than just for the central forecast. Tune
        # the window per metric — disk space deserves more warning than
        # transient queue depth.
        - alert: ForecastDiskFillImminent
          expr: |
            node_filesystem_avail_bytes_forecast_time_to_threshold_seconds{
              name="critical", comparator="lt", level="95"
            } < 6 * 60 * 60
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} disk will hit the floor within 6h (95% band)"
            description: |
              The conservative 95% forecast for {{ $labels.instance }}
              {{ $labels.mountpoint }} reaches the configured
              ``critical`` floor within 6h. Investigate growth and
              provision capacity.

        # CPU saturation ETA on the central forecast. Useful as an early
        # heads-up well before any deviation alert would trigger.
        - alert: ForecastCPUSaturationApproaching
          expr: |
            node_cpu_busy_pct_forecast_time_to_threshold_seconds{
              name="warn", comparator="gt"
            } < 4 * 60 * 60
          for: 30m
          labels:
            severity: info
          annotations:
            summary: "{{ $labels.instance }} CPU forecast to cross warn threshold within 4h"
            description: |
              The CPU busy-percent forecast for {{ $labels.instance }} is
              expected to cross the configured ``warn`` threshold within
              4 hours. Right-size before SLO-impacting saturation.

        # Predictive will-breach alert. Reads the boolean directly so the
        # rule stays a one-liner — the heavy lifting (ETA + alert_within
        # comparison) is done by the forecaster. Pin ``level="95"`` so the
        # rule fires once per series on the conservative band; the
        # corresponding ``forecast_time_to_threshold_seconds`` value at the
        # same labelset is the operator-visible "when" for the breach.
        - alert: ForecastWillBreach
          expr: |
            node_filesystem_avail_bytes_forecast_will_breach{
              severity="critical", level="95"
            } == 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.instance }}{{ $labels.mountpoint }} will breach within the configured alert_within window"
            description: |
              {{ $labels.id }} for {{ $labels.instance }}
              {{ $labels.mountpoint }} (95% band) is predicted to cross the
              ``{{ $labels.name }}`` threshold inside the configured
              ``alert_within`` window. Cross-reference
              ``forecast_time_to_threshold_seconds`` at the same label set
              for the exact ETA.

        # Growth-rate-change alert. Compares the 1d window slope
        # against the 7d baseline; magnitudes are kept absolute so the
        # alert catches sudden *deceleration* of a free-space metric
        # (i.e. accelerating fill) symmetrically with sudden growth.
        # ``clamp_min`` guards against divide-by-zero on cold series.
        - alert: ForecastGrowthRateSpike
          expr: |
            abs(node_filesystem_avail_bytes_forecast_growth_rate{window="1d"})
              /
            clamp_min(
              abs(
                node_filesystem_avail_bytes_forecast_growth_rate{window="7d"} offset 1d
              ),
              1
            )
              > 3
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }}{{ $labels.mountpoint }} growth rate has tripled vs last week"
            description: |
              The 1-day forecast growth rate for {{ $labels.instance }}
              ({{ $labels.mountpoint }}) is more than 3x the 7-day
              baseline. Investigate whether a workload change or leak is
              driving accelerated consumption.

    - name: promforecast.slo.examples
      interval: 1m
      rules:
        # SLO error budget will be exhausted at the current burn rate.
        # Generic template aligned with the SRE workbook's burn-rate
        # alerts — pair short / long windows on a single query to get
        # multi-window/multi-burn-rate coverage. The example here uses
        # a single 30d window; a real deployment would also configure
        # 5m and 1h windows on the same query and alert on each.
        - alert: SLOBudgetExhaustingSoon
          expr: |
            http_request_error_ratio_forecast_error_budget_exhausted_in_seconds{
              window="30d"
            } < 86400
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.id }} 30d error budget projected to exhaust in <24h"
            description: |
              At the predicted burn rate, the configured 30d error
              budget for {{ $labels.id }} will be consumed within 24
              hours. Investigate the source of elevated errors and
              consider whether to slow the error rate or accept the
              budget overrun.

        # Fast burn — the predicted rate is multiples of the
        # sustainable rate. ``burn_rate > 14.4`` corresponds to "the
        # entire 30d budget would be exhausted in 2 days at this
        # rate"; tune for your SLO and on-call sensitivity.
        - alert: SLOFastBurn
          expr: |
            http_request_error_ratio_forecast_error_budget_burn_rate{
              window="30d"
            } > 14.4
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.id }} burning the 30d error budget at >14.4x sustainable rate"
            description: |
              At the predicted burn rate for {{ $labels.id }}, the
              monthly budget would be consumed in roughly 2 days.
              Cross-reference with ``..._exhausted_in_seconds`` for the
              projected exhaustion time.

    - name: promforecast.queue.examples
      interval: 1m
      rules:
        # Queue is not actually draining — the projected curve is flat
        # or growing, so the drain ETA is +Inf. Without this rule a
        # stuck consumer is invisible because alerts on
        # ``forecast_time_to_drain_seconds < N`` silently never match.
        - alert: QueueNotDraining
          expr: |
            kafka_consumer_lag_forecast_time_to_drain_seconds{
              name="drained"
            } == +Inf
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.id }} is not projected to drain within the horizon"
            description: |
              The forecast for {{ $labels.id }} predicts no crossing
              below the configured drain threshold within the horizon
              — the queue is not actually being worked off. Check
              consumer health and parallelism.

        # Drain projected to happen far in the future. Useful as an
        # early-warning alert on a backlog that *will* eventually
        # drain but not before SLAs are at risk.
        - alert: QueueDrainSlow
          expr: |
            kafka_consumer_lag_forecast_time_to_drain_seconds{
              name="drained"
            } > 4 * 60 * 60
            and
            kafka_consumer_lag_forecast_time_to_drain_seconds{
              name="drained"
            } != +Inf
          for: 30m
          labels:
            severity: info
          annotations:
            summary: "{{ $labels.id }} projected to take >4h to drain"
            description: |
              The forecast for {{ $labels.id }} predicts a drain ETA
              above 4h. The queue is being worked off, but the
              backlog is too large to clear before downstream SLAs
              are at risk. Add consumer capacity or shed load.

    # ----------------------------------------------------------------
    # Deploy-anchored risk score alerts.
    # ----------------------------------------------------------------
    # These rules assume the ``deploy_signals:`` top-level config
    # block is populated with at least one service. The forecaster
    # emits ``forecast_deploy_risk_score{deployment_id, service,
    # contributing_signals}`` per active deploy; an empty
    # ``deploy_signals`` produces no series and the alerts stay
    # quiet. ``contributing_signals >= 2`` keeps the alert from
    # firing on single-signal blips.
    - name: promforecast.deploy.examples
      interval: 1m
      rules:
        - alert: DeployHighRisk
          expr: |
            forecast_deploy_risk_score{contributing_signals!~"0|1"} > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Deploy {{ $labels.deployment_id }} on {{ $labels.service }} shows elevated risk"
            description: |
              The composite of |forecast_deviation_ratio| across the
              configured signals for {{ $labels.service }} exceeded
              0.5 for 5m after a deploy. Consider rolling back if
              the deviation persists or worsens — see DeployCriticalRisk.

        - alert: DeployCriticalRisk
          expr: |
            forecast_deploy_risk_score{contributing_signals!~"0|1"} > 1.0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Deploy {{ $labels.deployment_id }} on {{ $labels.service }} is materially degrading signals"
            description: |
              The composite of |forecast_deviation_ratio| across the
              configured signals for {{ $labels.service }} exceeded
              1.0 for 2m — at least one signal is a full band-width
              outside its forecast. Roll back unless the deploy is
              expected to shift the metric (in which case retrain
              the model with the new regime).
