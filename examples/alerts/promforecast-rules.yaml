apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: promforecast-rules
  labels:
    role: alert-rules
    app.kubernetes.io/part-of: promforecast
spec:
  groups:
    - name: promforecast.operational
      interval: 1m
      rules:
        # Forecaster has not produced a successful run in over 2h.
        - alert: ForecastStale
          expr: time() - forecast_last_run_timestamp_seconds > 7200
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "promforecast hasn't refreshed group {{ $labels.group }} in over 2h"
            description: |
              The forecaster has not produced a successful run for group
              {{ $labels.group }} in over 2 hours. Check pod logs and
              datasource availability.

        # Backtest accuracy has degraded — model needs retraining or
        # replacement. Threshold is intentionally loose; tune for the SLOs
        # of the metrics being forecasted.
        - alert: ForecastModelDegraded
          expr: forecast_accuracy_mape > 30
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: "Forecast accuracy degraded for {{ $labels.id }} (MAPE > 30%)"
            description: |
              Backtest MAPE for {{ $labels.id }} model {{ $labels.model }}
              at horizon {{ $labels.horizon }} has exceeded 30% for 24h.
              Consider retraining, switching models, or extending the
              lookback window.

        # v1.3: parallel rule for intermittent / count-shaped series. MAPE
        # is undefined wherever the actual is zero, so the rule above
        # silently never fires for these series; MASE > 1.0 means the
        # forecast is doing worse than a seasonal naive baseline.
        - alert: ForecastModelDegradedMASE
          expr: forecast_accuracy_mase > 1.0
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: "Forecast MASE > 1.0 for {{ $labels.id }} — worse than seasonal naive"
            description: |
              Backtest MASE for {{ $labels.id }} model {{ $labels.model }}
              at horizon {{ $labels.horizon }} has exceeded 1.0 for 24h —
              the forecast is doing no better than a seasonal naive
              baseline. Particularly useful for intermittent / count
              series where MAPE is undefined wherever the actual is zero.

        # The exporter keeps falling back to the configured fallback model,
        # which means the configured `models:` list isn't a good fit for
        # this data. Symptom of mis-configuration, not an outage.
        - alert: ForecastFallbackPersistent
          expr: count by (group) (forecast_quality_score{model_fallback="true"}) > 0
          for: 6h
          labels:
            severity: info
          annotations:
            summary: "Auto-select keeps falling back for group {{ $labels.group }}"
            description: |
              At least one series in {{ $labels.group }} has been falling
              back to the configured fallback model for 6h. The configured
              models are likely a poor fit for this data.

        # Persistently low quality across a group: forecasts shouldn't be
        # trusted for alerting. Tune the threshold; 0.4 is a useful default.
        # Cold-start fits are excluded because their quality score is
        # capped at ``cold_start.max_quality_score`` (default 0.5) by
        # design — they would otherwise drag the per-group average and
        # noisily trip this alert until the underlying series matures.
        - alert: ForecastQualityLow
          expr: |
            avg by (group) (forecast_quality_score{cold_start!="true"}) < 0.4
          for: 6h
          labels:
            severity: info
          annotations:
            summary: "Average forecast quality for group {{ $labels.group }} is low"
            description: |
              Average forecast_quality_score for group {{ $labels.group }}
              (excluding cold-start fits) is below 0.4 for 6h. Treat
              downstream forecast-based alerts with caution and
              investigate model fit, band width, and data coverage.

        # Quality score is composed multiplicatively from MAPE / band /
        # coverage; if it sticks at zero for a single series for hours,
        # the inputs are likely degenerate (no MAPE, all-zero data).
        # Excludes cold-start: those scores can land at a configured
        # ``max_quality_score`` and are not a model-degradation signal.
        - alert: ForecastQualityZero
          expr: forecast_quality_score{cold_start!="true"} == 0
          for: 1h
          labels:
            severity: info
          annotations:
            summary: "Forecast quality is 0 for {{ $labels.id }} ({{ $labels.model }})"
            description: |
              forecast_quality_score for {{ $labels.id }}
              ({{ $labels.model }}) has been zero for 1h. The model is
              likely producing meaningless output for this series; check
              data coverage and band width.

        # v1.3: cold-start sibling headroom is thinning. The configured
        # ``min_siblings`` is the contract; once the gauge drops below
        # the threshold the next cold-start fit will silently fall
        # through to the standard min_points drop. Catch the early
        # warning here so operators can fix the borrow query before the
        # forecast disappears.
        - alert: ForecastColdStartSiblingsLow
          expr: forecast_cold_start_siblings < 3
          for: 30m
          labels:
            severity: info
          annotations:
            summary: "Cold-start siblings thinning for {{ $labels.group }}/{{ $labels.query }}"
            description: |
              The cold-start borrow query for
              {{ $labels.group }}/{{ $labels.query }} has fewer than 3
              usable siblings for 30m. Once the count drops below
              ``min_siblings`` the cold-start path stops emitting and
              short series fall back to the standard min_points drop —
              check whether peer renames or label-cardinality drift
              have thinned the borrow set.

    - name: promforecast.deviation
      interval: 1m
      rules:
        # Anomaly-detection signal: the actual is outside its forecast
        # band. Gated on quality so poor forecasts don't fire false
        # positives. Tune `for:` and the quality threshold to your noise
        # tolerance.
        - alert: ForecastDeviation
          expr: |
            forecast_deviation_outside_band == 1
            and on (id, group, model) forecast_quality_score > 0.6
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Actual {{ $labels.id }} is outside its forecast band"
            description: |
              {{ $labels.id }} (group {{ $labels.group }}, model
              {{ $labels.model }}, level {{ $labels.level }}) has been
              outside its forecast confidence band for 15m. Quality score
              for this series is above 0.6, so the deviation is likely
              meaningful.

        # Stronger signal: actual is far outside the band (|ratio| > 2 means
        # it's a full band-width past the edge). Good candidate for paging.
        - alert: ForecastDeviationSevere
          expr: |
            abs(forecast_deviation_ratio) > 2
            and on (id, group, model) forecast_quality_score > 0.6
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Actual {{ $labels.id }} is far outside its forecast band"
            description: |
              {{ $labels.id }} (group {{ $labels.group }}, model
              {{ $labels.model }}, level {{ $labels.level }}) has a
              deviation ratio with magnitude above 2 for 5m. The actual is
              well past the edge of the high-confidence forecast band.

    - name: promforecast.capacity.examples
      interval: 5m
      rules:
        # Replace the metric and threshold with your own; this is a
        # template — do not deploy as-is without tuning. The
        # ``<id>_forecast`` snapshot value is the *end-of-horizon*
        # forecast (carrying ``horizon="next"``, which means "the next
        # snapshot value to be served") — see ``docs/models.md`` for
        # the convention. If ``defaults.horizon: 24h`` is the configured
        # forecast horizon then this alert reads "the disk is forecast
        # to be empty 24h from now".
        - alert: NodeFilesystemForecastedFull
          expr: node_filesystem_avail_bytes_forecast < 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }}:{{ $labels.mountpoint }} forecast to fill before horizon"
            description: |
              The end-of-horizon forecast for free space on
              {{ $labels.instance }} ({{ $labels.mountpoint }}) is below
              zero. Provision capacity or clean up.

        # v1.2: alert on the time-to-threshold ETA family directly.
        # Read against the conservative band (``level="95"``) so the
        # alert fires for "will hit threshold within N hours at 95%
        # confidence" rather than just for the central forecast. Tune
        # the window per metric — disk space deserves more warning than
        # transient queue depth.
        - alert: ForecastDiskFillImminent
          expr: |
            node_filesystem_avail_bytes_forecast_time_to_threshold_seconds{
              name="critical", comparator="lt", level="95"
            } < 6 * 60 * 60
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} disk will hit the floor within 6h (95% band)"
            description: |
              The conservative 95% forecast for {{ $labels.instance }}
              {{ $labels.mountpoint }} reaches the configured
              ``critical`` floor within 6h. Investigate growth and
              provision capacity.

        # CPU saturation ETA on the central forecast. Useful as an early
        # heads-up well before any deviation alert would trigger.
        - alert: ForecastCPUSaturationApproaching
          expr: |
            node_cpu_busy_pct_forecast_time_to_threshold_seconds{
              name="warn", comparator="gt"
            }
            and on (instance) (
              node_cpu_busy_pct_forecast_time_to_threshold_seconds{
                name="warn", comparator="gt"
              } < 4 * 60 * 60
            )
          for: 30m
          labels:
            severity: info
          annotations:
            summary: "{{ $labels.instance }} CPU forecast to cross warn threshold within 4h"
            description: |
              The CPU busy-percent forecast for {{ $labels.instance }} is
              expected to cross the configured ``warn`` threshold within
              4 hours. Right-size before SLO-impacting saturation.

        # v1.2: growth-rate-change alert. Compares the 1d window slope
        # against the 7d baseline; magnitudes are kept absolute so the
        # alert catches sudden *deceleration* of a free-space metric
        # (i.e. accelerating fill) symmetrically with sudden growth.
        # ``clamp_min`` guards against divide-by-zero on cold series.
        - alert: ForecastGrowthRateSpike
          expr: |
            abs(node_filesystem_avail_bytes_forecast_growth_rate{window="1d"})
              /
            clamp_min(
              abs(
                node_filesystem_avail_bytes_forecast_growth_rate{window="7d"} offset 1d
              ),
              1
            )
              > 3
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }}{{ $labels.mountpoint }} growth rate has tripled vs last week"
            description: |
              The 1-day forecast growth rate for {{ $labels.instance }}
              ({{ $labels.mountpoint }}) is more than 3x the 7-day
              baseline. Investigate whether a workload change or leak is
              driving accelerated consumption.
