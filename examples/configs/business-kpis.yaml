# Forecast user-facing KPIs (request rate, error budget, latency).
# Replace the metric names and labels with whatever your services expose.

apiVersion: promforecast.io/v1

datasource:
  url: http://victoriametrics:8428/

defaults:
  lookback: 28d
  step: 5m
  horizon: 24h
  # Mix the shorthand and full ModelSpec forms — the full form lets you
  # tune individual model hyperparameters without writing custom code.
  models:
    - SeasonalNaive
    - name: AutoARIMA
      params:
        max_p: 5
        max_q: 5
    - AutoETS
  season_length: 288
  accuracy:
    # Combine all three models per series, weighted by inverse-MAPE.
    # The component models are still emitted alongside the ensemble row.
    auto_select: ensemble
    fallback_model: SeasonalNaive
    fallback_mape_threshold: 30

groups:
  - name: business_kpis
    priority: 1
    queries:
      - id: http_requests_per_second
        promql: |
          sum by (service) (rate(http_requests_total[5m]))
        # Calendar features cost nothing and most consumer-facing
        # services have strong intraday and weekly patterns.
        regressors:
          - id: hour_of_day
            type: calendar
          - id: is_weekend
            type: calendar

      - id: http_5xx_per_second
        promql: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[5m]))

      # Error ratio with SLO error-budget forecasting. The forecast is
      # the predicted error rate; the slo block turns it into burn rate
      # and exhaustion ETAs. Pair short and long windows for
      # multi-window/multi-burn-rate alerting per the SRE workbook.
      - id: http_request_error_ratio
        promql: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[5m]))
            /
          sum by (service) (rate(http_requests_total[5m]))
        slo:
          objective: 99.9
          windows: [5m, 1h, 30d]
        # Suggest the lowest-load 15-minute windows for scheduling
        # certificate rotations or other brief downtime; rate of
        # requests is a reasonable proxy for impact when the dominant
        # cost is request count.
        recommended_windows:
          enabled: true
          duration: 15m
          lookahead: 48h
          count: 3

      - id: http_request_p95_seconds
        promql: |
          histogram_quantile(0.95,
            sum by (service, le) (rate(http_request_duration_seconds_bucket[5m]))
          )

      # Hourly KPI rolled up by the upstream pipeline. We don't need the
      # 5-minute resolution (and there isn't any) — overriding step + the
      # season_length keeps the seasonality aligned to the natural cadence
      # without forking the whole defaults block.
      - id: daily_active_users_hourly
        promql: |
          sum(daily_active_users)
        step: 1h
        season_length: 24
        regressors:
          - id: hour_of_day
            type: calendar
          - id: day_of_week
            type: calendar
