# Forecast Kubernetes resource usage from kube-state-metrics and kubelet.

apiVersion: promforecast.io/v1

datasource:
  url: http://victoriametrics:8428/

defaults:
  lookback: 14d
  step: 5m
  horizon: 24h
  models: [AutoARIMA, SeasonalNaive]
  season_length: 288

groups:
  - name: kube_resources
    priority: 5
    queries:
      - id: pod_cpu_usage_cores
        promql: |
          sum by (namespace) (rate(container_cpu_usage_seconds_total{container!="",pod!=""}[5m]))

      - id: pod_memory_working_set_bytes
        promql: |
          sum by (namespace) (container_memory_working_set_bytes{container!="",pod!=""})

      - id: persistentvolumeclaim_used_bytes
        promql: |
          sum by (namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes)

      # Queue burn-down example. The le_drain comparator changes the
      # ETA family in two ways: the metric name becomes
      # ``..._forecast_time_to_drain_seconds`` (parallel to the
      # standard ETA), and the no-crossing sentinel is +Inf rather
      # than NaN so the "queue is not draining" alert can match it.
      - id: kafka_consumer_lag
        promql: |
          sum by (consumergroup, topic) (kafka_consumergroup_lag)
        thresholds:
          - name: drained
            value: 0
            comparator: le_drain
