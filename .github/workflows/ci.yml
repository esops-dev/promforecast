name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forecaster
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "forecaster/pyproject.toml"

      - run: uv sync --all-extras

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy --strict src

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forecaster
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "forecaster/pyproject.toml"

      - run: uv sync --all-extras
      - run: uv run pytest --cov=promforecast --cov-report=xml

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: forecaster/coverage.xml
          if-no-files-found: ignore

  prophet-plugin:
    name: Lint + test promforecast-prophet
    # The Prophet plug-in lives in this monorepo so we keep its quality
    # bar in lockstep with the forecaster: the same ruff/mypy strictness
    # and entry-point discovery contract. Real Prophet is *not* installed —
    # the tests stub it out — because the Stan toolchain blows up CI time
    # for a smoke check. The end-to-end fit path is exercised via
    # docker-compose by anyone actually running the package against data.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: community/promforecast-prophet
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "community/promforecast-prophet/pyproject.toml"

      # Install only the dev extras and a path-pinned ``promforecast`` so we
      # exercise the same forecaster source the rest of CI sees, without
      # paying the prophet/cmdstanpy install cost. The ``--no-deps`` flag
      # keeps prophet from being pulled in transitively; tests stub it.
      - name: Install package and dev deps (without prophet)
        run: |
          uv venv
          uv pip install -e ../../forecaster
          uv pip install --no-deps -e .
          uv pip install pytest ruff mypy pandas pandas-stubs

      # ``uv run`` defaults to ``uv sync`` first, which would try to
      # resolve ``promforecast`` from PyPI (where it isn't published) and
      # fail. ``--no-sync`` keeps the manually-populated venv we built
      # above; without it every lint step below is dead on arrival.
      - name: ruff check
        run: uv run --no-sync ruff check .

      - name: ruff format --check
        run: uv run --no-sync ruff format --check .

      - name: mypy --strict
        run: uv run --no-sync mypy --strict src

      - name: pytest
        run: uv run --no-sync pytest

  chart-lint:
    name: Lint Helm charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # chart-testing diffs against the base branch to find changed
          # charts; without history its --target-branch comparison sees
          # nothing and the lint job becomes a no-op.
          fetch-depth: 0

      - uses: azure/setup-helm@v5
        with:
          version: latest

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install chart-testing
        # chart-testing wraps `helm lint`, schema-checks against the
        # vendored values.schema.json, and (optionally) installs charts
        # against a kind cluster. We skip the kind-based install step here
        # because the deployment is exercised end-to-end by the
        # docker-compose dev stack and a kind run would push CI past 10min.
        uses: helm/chart-testing-action@v2.9.0

      - name: Register Helm repositories
        # ``ct lint`` rebuilds chart dependencies as part of its own pass
        # (it doesn't trust a pre-existing ``charts/*.tgz`` cache). The
        # umbrella stack pulls victoria-metrics-single from the upstream
        # VM chart repo, so that repo MUST be registered with helm before
        # ``ct lint`` runs — otherwise it bails with "no repository
        # definition for ...". This step is idempotent and the URL must
        # match the dependency entry in charts/promforecast-stack/Chart.yaml.
        run: |
          helm repo add victoria-metrics https://victoriametrics.github.io/helm-charts/
          helm repo update

      - name: helm dependency update
        run: |
          helm dependency update charts/promforecast
          helm dependency update charts/promforecast-stack

      - name: ct lint
        # --validate-maintainers=false: maintainers are tracked in CODEOWNERS
        # rather than chart metadata.
        # --check-version-increment=false: the chart-releaser flow handles
        # version bumps automatically; we don't gate every PR on a manual bump.
        # --target-branch defaults to ``main``; explicit for clarity.
        run: |
          ct lint \
            --charts charts/promforecast,charts/promforecast-stack,charts/promforecast-metrics-adapter \
            --validate-maintainers=false \
            --check-version-increment=false \
            --target-branch ${{ github.event.repository.default_branch }}

      - name: helm lint --strict
        # Belt and braces — `ct lint` calls `helm lint` but not in strict
        # mode. Strict mode treats deprecations and recommendation warnings
        # as failures, which is what we want for a chart we publish.
        run: |
          helm lint --strict charts/promforecast
          helm lint --strict charts/promforecast-stack
          helm lint --strict charts/promforecast-metrics-adapter

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz
          sudo install kubeconform /usr/local/bin/

      - name: kubeconform
        run: |
          helm template charts/promforecast                 | kubeconform -strict -summary -ignore-missing-schemas
          helm template charts/promforecast-stack           | kubeconform -strict -summary -ignore-missing-schemas
          helm template charts/promforecast-metrics-adapter | kubeconform -strict -summary -ignore-missing-schemas
          # Also validate the bundled dashboards + PrometheusRule path so CI
          # catches regressions in the templated assets, not only the default
          # off path.
          helm template charts/promforecast-stack \
              --set dashboards.enabled=true \
              --set prometheusRules.enabled=true \
            | kubeconform -strict -summary -ignore-missing-schemas

      - name: values.schema.json drift check
        # The pydantic config schema is the source of truth for the
        # forecaster's runtime config. The chart's values.schema.json gates
        # `helm install` against the same field set; the ConfigMap template
        # passes ``.Values.config`` through to the forecaster verbatim. They
        # MUST agree — otherwise an operator can `helm install` a config
        # that crashes the forecaster on boot. This step renders the chart
        # ConfigMap and validates the embedded config.yaml against the
        # forecaster's own loader, so any drift fails CI.
        #
        # We invoke the setup-python interpreter via the absolute path
        # ``$pythonLocation/bin/python3`` instead of a bare ``python3``.
        # The chart-testing-action above provisions its own venv (without
        # ``pip`` or ``pydantic``) and prepends it to PATH, so a bare
        # ``python3`` resolves to ct's venv and a bare ``pip`` is missing
        # entirely. ``$pythonLocation`` is exported by actions/setup-python
        # and persists across steps, giving us a stable handle on the
        # Python we actually want.
        env:
          # Avoid the literal name ``PY`` here — that's also the heredoc
          # terminator below, and reading both right next to each other is
          # already confusing enough.
          DRIFT_PYTHON: ${{ env.pythonLocation }}/bin/python3
        run: |
          # Minimum set of third-party imports reachable from
          # ``promforecast.config``. Tracked manually because we deliberately
          # avoid installing the full forecaster (which would pull
          # statsforecast/numba/pandas — minutes of CI time for a schema
          # check). If a future change adds another import to ``config.py``
          # or its non-stdlib transitive deps, the failure surfaces as a
          # ``ModuleNotFoundError`` here and this list is the place to
          # extend it.
          "$DRIFT_PYTHON" -m pip install --quiet pyyaml pydantic structlog
          "$DRIFT_PYTHON" - <<'PY'
          import pathlib, subprocess, sys, yaml
          sys.path.insert(0, "forecaster/src")
          import promforecast.config as cfg_module

          # Each bundled example must parse against the pydantic schema on
          # its own. Catches typos and forbidden-extras at PR time instead
          # of when an operator copies an example into their cluster.
          example_paths = sorted(pathlib.Path("examples").rglob("*.yaml"))
          example_paths += [pathlib.Path("docker/dev-config.yaml")]
          failed = []
          for path in example_paths:
              # Skip non-forecaster YAML (alert manifests, Kubernetes
              # objects). The cheapest reliable filter is the presence of a
              # top-level ``datasource`` mapping, which only forecaster
              # configs carry.
              doc = yaml.safe_load(path.read_text()) or {}
              if not isinstance(doc, dict) or "datasource" not in doc:
                  continue
              try:
                  cfg_module.load(path)
                  print(f"OK: {path}")
              except Exception as exc:
                  failed.append((path, exc))
          if failed:
              print("\nExample configs failed schema validation:")
              for path, exc in failed:
                  print(f"  {path}: {exc}")
              sys.exit(1)

          # The chart's default values.yaml must also chart-render into a
          # config that validates. Run with the node-capacity groups so we
          # exercise more than the default ``groups: []``.
          example = yaml.safe_load(pathlib.Path("examples/configs/node-capacity.yaml").read_text())
          values_override = pathlib.Path("/tmp/chart-values.yaml")
          values_override.write_text(yaml.safe_dump({"config": {"groups": example["groups"]}}))
          rendered = subprocess.check_output(
              ["helm", "template", "charts/promforecast", "-f", str(values_override)],
              text=True,
          )
          docs = list(yaml.safe_load_all(rendered))
          cm = next(
              d for d in docs
              if d and d.get("kind") == "ConfigMap" and "config.yaml" in d.get("data", {})
          )
          tmp = pathlib.Path("/tmp/chart-config.yaml")
          tmp.write_text(cm["data"]["config.yaml"])
          try:
              cfg_module.load(tmp)
              print("OK: chart-rendered config validates against the forecaster's pydantic schema")
          except Exception as exc:
              print(f"chart values.yaml does not validate against the forecaster schema:\n  {exc}")
              sys.exit(1)

          # The production reference Helm values must also chart-render
          # into a valid forecaster config. Without this guard, a copy-edit
          # to the reference (which new adopters lean on as a starting
          # point) could ship a broken config that only fails at first
          # boot inside a cluster.
          rendered = subprocess.check_output(
              ["helm", "template", "charts/promforecast",
               "-f", "examples/production/forecaster/values.yaml"],
              text=True,
          )
          docs = list(yaml.safe_load_all(rendered))
          cm = next(
              d for d in docs
              if d and d.get("kind") == "ConfigMap" and "config.yaml" in d.get("data", {})
          )
          tmp = pathlib.Path("/tmp/prod-chart-config.yaml")
          tmp.write_text(cm["data"]["config.yaml"])
          try:
              cfg_module.load(tmp)
              print("OK: production values.yaml chart-renders to a valid forecaster config")
          except Exception as exc:
              print(f"production values.yaml does not validate after chart rendering:\n  {exc}")
              sys.exit(1)

          # The Flux ConfigMap embeds the chart values as a YAML string.
          # Pull the forecaster config back out and validate it so the
          # three production sources can't silently drift apart.
          flux_cm = yaml.safe_load(
              pathlib.Path("examples/production/flux/values-configmap.yaml").read_text()
          )
          flux_values = yaml.safe_load(flux_cm["data"]["values.yaml"])
          tmp = pathlib.Path("/tmp/flux-forecaster-config.yaml")
          tmp.write_text(yaml.safe_dump(flux_values["config"]))
          try:
              cfg_module.load(tmp)
              print("OK: Flux values ConfigMap carries a valid forecaster config")
          except Exception as exc:
              print(f"Flux values-configmap.yaml carries an invalid forecaster config:\n  {exc}")
              sys.exit(1)
          PY

      - name: Dashboards are valid JSON
        run: |
          for f in dashboards/grafana/*.json; do
            python3 -m json.tool "$f" > /dev/null
          done

      - name: Example alerts and chart rules cover the same core alert set
        # The standalone manifest in examples/alerts and the chart-templated
        # PrometheusRule are intentionally separate artifacts (one for non-
        # Helm users, one for chart users) but the *core* alert names must
        # match — otherwise a rule added in one place silently misses the
        # other. Per-environment template groups (suffix ``.examples``) are
        # exempt and live only in the standalone manifest.
        run: |
          python3 - <<'PY'
          import re, sys, pathlib, yaml
          example = yaml.safe_load(pathlib.Path("examples/alerts/promforecast-rules.yaml").read_text())
          example_alerts = {
              r["alert"]
              for g in example["spec"]["groups"]
              if not g["name"].endswith(".examples")
              for r in g["rules"]
              if "alert" in r
          }
          chart_text = pathlib.Path(
              "charts/promforecast-stack/templates/prometheusrule.yaml"
          ).read_text()
          chart_alerts = set(re.findall(r"^\s*-\s+alert:\s+(\S+)\s*$", chart_text, re.M))
          missing_in_chart = example_alerts - chart_alerts
          missing_in_example = chart_alerts - example_alerts
          if missing_in_chart or missing_in_example:
              print("Alert drift between examples/alerts and chart template:")
              if missing_in_chart:
                  print(f"  missing in chart: {sorted(missing_in_chart)}")
              if missing_in_example:
                  print(f"  missing in example: {sorted(missing_in_example)}")
              sys.exit(1)
          print(f"core alert sets match ({len(example_alerts)} alerts)")
          PY

  container:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: forecaster
          push: false
          load: true
          tags: promforecast:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Trivy
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Trivy scan
        # exit-code 0: report findings to the job log, do not fail the PR on
        # CVEs in upstream base images. Tighten once we control the image
        # surface. SARIF upload to Code Scanning is intentionally not wired
        # up — it requires GitHub Advanced Security on private repos.
        run: |
          trivy image \
            --format table \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            promforecast:ci
