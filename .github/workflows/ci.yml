name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forecaster
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "forecaster/pyproject.toml"

      - run: uv sync --all-extras

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy --strict src

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forecaster
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "forecaster/pyproject.toml"

      - run: uv sync --all-extras
      - run: uv run pytest --cov=promforecast --cov-report=xml

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: forecaster/coverage.xml
          if-no-files-found: ignore

  chart-lint:
    name: Lint Helm charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # chart-testing diffs against the base branch to find changed
          # charts; without history its --target-branch comparison sees
          # nothing and the lint job becomes a no-op.
          fetch-depth: 0

      - uses: azure/setup-helm@v5
        with:
          version: latest

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install chart-testing
        # chart-testing wraps `helm lint`, schema-checks against the
        # vendored values.schema.json, and (optionally) installs charts
        # against a kind cluster. We skip the kind-based install step here
        # because the deployment is exercised end-to-end by the
        # docker-compose dev stack and a kind run would push CI past 10min.
        uses: helm/chart-testing-action@v2.8.0

      - name: Register Helm repositories
        # ``ct lint`` rebuilds chart dependencies as part of its own pass
        # (it doesn't trust a pre-existing ``charts/*.tgz`` cache). The
        # umbrella stack pulls victoria-metrics-single from the upstream
        # VM chart repo, so that repo MUST be registered with helm before
        # ``ct lint`` runs — otherwise it bails with "no repository
        # definition for ...". This step is idempotent and the URL must
        # match the dependency entry in charts/promforecast-stack/Chart.yaml.
        run: |
          helm repo add victoria-metrics https://victoriametrics.github.io/helm-charts/
          helm repo update

      - name: helm dependency update
        run: |
          helm dependency update charts/promforecast
          helm dependency update charts/promforecast-stack

      - name: ct lint
        # --validate-maintainers=false: maintainers are tracked in CODEOWNERS
        # rather than chart metadata.
        # --check-version-increment=false: the chart-releaser flow handles
        # version bumps automatically; we don't gate every PR on a manual bump.
        # --target-branch defaults to ``main``; explicit for clarity.
        run: |
          ct lint \
            --charts charts/promforecast,charts/promforecast-stack \
            --validate-maintainers=false \
            --check-version-increment=false \
            --target-branch ${{ github.event.repository.default_branch }}

      - name: helm lint --strict
        # Belt and braces — `ct lint` calls `helm lint` but not in strict
        # mode. Strict mode treats deprecations and recommendation warnings
        # as failures, which is what we want for a chart we publish.
        run: |
          helm lint --strict charts/promforecast
          helm lint --strict charts/promforecast-stack

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz
          sudo install kubeconform /usr/local/bin/

      - name: kubeconform
        run: |
          helm template charts/promforecast       | kubeconform -strict -summary -ignore-missing-schemas
          helm template charts/promforecast-stack | kubeconform -strict -summary -ignore-missing-schemas
          # Also validate the bundled dashboards + PrometheusRule path so CI
          # catches regressions in the templated assets, not only the default
          # off path.
          helm template charts/promforecast-stack \
              --set dashboards.enabled=true \
              --set prometheusRules.enabled=true \
            | kubeconform -strict -summary -ignore-missing-schemas

      - name: values.schema.json drift check
        # The pydantic config schema is the source of truth for the
        # forecaster's runtime config. The chart's values.schema.json gates
        # `helm install` against the same field set; the ConfigMap template
        # passes ``.Values.config`` through to the forecaster verbatim. They
        # MUST agree — otherwise an operator can `helm install` a config
        # that crashes the forecaster on boot. This step renders the chart
        # ConfigMap and validates the embedded config.yaml against the
        # forecaster's own loader, so any drift fails CI.
        run: |
          pip install pyyaml pydantic
          python3 - <<'PY'
          import pathlib, subprocess, sys, yaml
          # Render the chart with the example node-capacity groups so we
          # exercise more than the default ``groups: []``.
          example = yaml.safe_load(pathlib.Path("examples/configs/node-capacity.yaml").read_text())
          values_override = pathlib.Path("/tmp/chart-values.yaml")
          values_override.write_text(yaml.safe_dump({"config": {"groups": example["groups"]}}))
          rendered = subprocess.check_output(
              ["helm", "template", "charts/promforecast", "-f", str(values_override)],
              text=True,
          )
          docs = list(yaml.safe_load_all(rendered))
          cm = next(
              d for d in docs
              if d and d.get("kind") == "ConfigMap" and "config.yaml" in d.get("data", {})
          )
          tmp = pathlib.Path("/tmp/chart-config.yaml")
          tmp.write_text(cm["data"]["config.yaml"])
          sys.path.insert(0, "forecaster/src")
          import promforecast.config as cfg_module
          try:
              cfg_module.load(tmp)
              print("OK: chart-rendered config validates against the forecaster's pydantic schema")
          except Exception as exc:
              print(f"chart values.yaml does not validate against the forecaster schema:\n  {exc}")
              sys.exit(1)
          PY

      - name: Dashboards are valid JSON
        run: |
          for f in dashboards/grafana/*.json; do
            python3 -m json.tool "$f" > /dev/null
          done

      - name: Example alerts and chart rules cover the same core alert set
        # The standalone manifest in examples/alerts and the chart-templated
        # PrometheusRule are intentionally separate artifacts (one for non-
        # Helm users, one for chart users) but the *core* alert names must
        # match — otherwise a rule added in one place silently misses the
        # other. Per-environment template groups (suffix ``.examples``) are
        # exempt and live only in the standalone manifest.
        run: |
          python3 - <<'PY'
          import re, sys, pathlib, yaml
          example = yaml.safe_load(pathlib.Path("examples/alerts/promforecast-rules.yaml").read_text())
          example_alerts = {
              r["alert"]
              for g in example["spec"]["groups"]
              if not g["name"].endswith(".examples")
              for r in g["rules"]
              if "alert" in r
          }
          chart_text = pathlib.Path(
              "charts/promforecast-stack/templates/prometheusrule.yaml"
          ).read_text()
          chart_alerts = set(re.findall(r"^\s*-\s+alert:\s+(\S+)\s*$", chart_text, re.M))
          missing_in_chart = example_alerts - chart_alerts
          missing_in_example = chart_alerts - example_alerts
          if missing_in_chart or missing_in_example:
              print("Alert drift between examples/alerts and chart template:")
              if missing_in_chart:
                  print(f"  missing in chart: {sorted(missing_in_chart)}")
              if missing_in_example:
                  print(f"  missing in example: {sorted(missing_in_example)}")
              sys.exit(1)
          print(f"core alert sets match ({len(example_alerts)} alerts)")
          PY

  container:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: forecaster
          push: false
          load: true
          tags: promforecast:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Trivy
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Trivy scan
        # exit-code 0: report findings to the job log, do not fail the PR on
        # CVEs in upstream base images. Tighten once we control the image
        # surface. SARIF upload to Code Scanning is intentionally not wired
        # up — it requires GitHub Advanced Security on private repos.
        run: |
          trivy image \
            --format table \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            promforecast:ci
