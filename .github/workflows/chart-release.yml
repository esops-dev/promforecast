name: Chart release

on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - '.github/workflows/chart-release.yml'

permissions:
  contents: read

concurrency:
  group: chart-release
  cancel-in-progress: false

jobs:
  release:
    name: chart-releaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Update chart dependencies
        run: |
          helm dependency update charts/promforecast
          helm dependency update charts/promforecast-stack

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
