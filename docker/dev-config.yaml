# Local-dev config: short lookback, fast refresh, low min_points so forecasts
# produce output minutes after the stack starts (instead of after 14 days).
# Backtesting and the deviation/quality emitters are on so the bundled
# Grafana dashboards have data to show. Not intended for any non-dev use.

apiVersion: promforecast.io/v1

datasource:
  url: http://victoriametrics:8428/
  timeout: 30s

# Exercise the Redis-backed query cache in dev. The two configured queries
# don't actually overlap, so cache *hits* won't happen on the same fit, but
# this still validates the full set/get round-trip on every refresh tick.
# A repeated /-/reload (no config change) confirms the second call serves
# from the cache: ``forecast_query_cache_events_total{kind="hit"}`` ticks up.
query_cache:
  enabled: true
  backend: redis
  ttl: 30s
  redis_address: redis:6379

server:
  listen: ":9091"
  refresh_interval: 1m

# Tight caps to exercise overflow handling end-to-end in dev.
safety:
  max_series_per_query: 50
  max_total_series: 500
  series_overflow: drop_lowest_priority
  fit_timeout: 60s
  query_timeout: 30s

defaults:
  lookback: 2h
  step: 1m
  horizon: 30m
  models: [AutoARIMA, SeasonalNaive]
  # Short, physically meaningless seasonality so SeasonalNaive can fit on
  # the small warm-up window (it needs at least one full season). Production
  # configs use 288 (5-min step → daily seasonality).
  season_length: 15
  confidence_levels: [80, 95]
  # ~30 min of data before the first fit. With step=1m that's fast enough
  # to validate the dashboards without waiting for production-scale lookback.
  min_points: 30
  accuracy:
    evaluate: true
    # Backtest hold-out is max(horizon) = 15 steps. min_points=30 guarantees
    # backtests run on the very first fit, so accuracy/deviation/quality
    # metrics start flowing immediately.
    horizons: [3m, 5m, 15m]
    auto_select: true
    fallback_model: SeasonalNaive
    fallback_mape_threshold: 50
    # Conformal calibration on so dev validates the new
    # forecast_band_calibration_offset family end-to-end. The 0.3 holdout
    # leaves ~9 calibration points at min_points=30 — small but enough
    # to exercise the wiring.
    conformal:
      enabled: true
      method: split
      holdout_fraction: 0.3
  emission:
    deviation: true
    quality: true

groups:
  - name: node_capacity
    priority: 10
    # Preprocessing: gap imputation explicitly configured (default behaviour
    # but spelled out so the dev-stack exercises the new metric families).
    # Outlier scrubbing + change-point detection stay off — they're opt-in
    # in production and the dev-stack mirrors that.
    preprocess:
      gaps:
        strategy: forward_fill
        max_gap: 10m
    queries:
      - id: node_cpu_busy_pct
        promql: |
          100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100)
      - id: node_memory_used_bytes
        promql: |
          node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes
