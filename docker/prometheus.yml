# Prometheus config for the local dev stack (docker-compose.dev.yml).
#
# Scrapes node-exporter and the forecaster, then remote_writes everything
# into VictoriaMetrics so the forecaster has a long-term TSDB to query.
# Production Prometheus is never the forecaster's read source — all
# forecaster reads go through the long-term TSDB instead.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: dev
    replica: prometheus-0

remote_write:
  - url: http://victoriametrics:8428/api/v1/write
    queue_config:
      max_samples_per_send: 5000
      capacity: 20000

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: http-demo
    static_configs:
      - targets: ["http-demo:8000"]

  - job_name: promforecast
    # honor_labels: forecast metrics carry the source ``instance`` label
    # (e.g. ``dev-host-a:9100``) from the underlying time-series. Without
    # honor_labels Prometheus would rename it to ``exported_instance`` and
    # add its own ``instance="forecaster:9091"``, which makes joining
    # ``node_cpu_busy_pct_forecast`` to ``node_cpu_seconds_total`` on
    # ``instance`` impossible from a dashboard.
    honor_labels: true
    static_configs:
      - targets: ["forecaster:9091"]
    # Drop forecast snapshot gauges (``*_forecast``, ``*_forecast_lower``,
    # ``*_forecast_upper``) from the scrape.
    #
    # *** Coupled to ``sink.remote_write.enabled`` in docker/dev-config.yaml. ***
    #
    # The dev-stack forecaster runs with ``sink.remote_write.enabled: true``
    # (see docker/dev-config.yaml) so the full forecast curve is pushed into
    # VictoriaMetrics directly. The scraped snapshot would be a duplicate
    # under a different label set (carries ``instance="forecaster:9091"``,
    # ``job="promforecast"``) and any dashboard not pre-filtering on the
    # labelset renders an average of the two — masking the smooth curve
    # under the 5-min snapshot staircase. The Helm charts derive the same
    # drop from the same toggle (see ``serviceMonitor.dropForecastSnapshots``
    # in charts/promforecast/values.yaml and the umbrella default in
    # charts/promforecast-stack/values.yaml). If you turn the sink off in
    # docker/dev-config.yaml, comment out the metric_relabel_configs block
    # below so the snapshot becomes the canonical write path again.
    #
    # Operational metrics (``forecast_failures_total``, ``forecast_quality_score``,
    # ``forecast_run_duration_seconds``, etc.) stay scraped — they only
    # exist on /metrics regardless of sink configuration. See
    # docs/architecture/emission-paths.md for the dual-source trap and the
    # cross-metric-join labelset asymmetry this drop preserves.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '.+_forecast(_lower|_upper)?'
        action: drop
