apiVersion: 1

datasources:
  # VictoriaMetrics is the default: it holds everything Prometheus has
  # (via remote_write, 30d retention) plus the forecaster's sink-pushed
  # forecast curves. Querying Prometheus directly is only useful for
  # debugging the scrape pipeline.
  - name: VictoriaMetrics
    type: prometheus
    access: proxy
    uid: victoriametrics
    url: http://victoriametrics:8428
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://prometheus:9090
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
