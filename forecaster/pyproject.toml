[project]
name = "promforecast"
version = "0.0.0"
description = "Forecasts for Prometheus-compatible metrics, exposed as Prometheus metrics."
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "The promforecast Authors" }]
keywords = ["prometheus", "forecasting", "monitoring", "statsforecast", "victoriametrics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "prometheus-client>=0.21",
    "statsforecast>=1.7",
    "pandas>=2.2",
    "numpy>=2.0",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    # Preprocessing dependencies:
    #   - ``ruptures``: change-point detection (PELT + Binary Segmentation).
    #     Pure-Python plus a small native kernel; cheap enough to keep in the
    #     base image so the feature can flip on with a config edit alone.
    #   - ``statsmodels``: STL decomposition used by the ``stl_residual``
    #     outlier detector. Heavier wheel but already a common forecasting
    #     dep; keeping it in the base avoids a confusing "method exists but
    #     errors at runtime" UX when the extras aren't installed.
    "ruptures>=1.1",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
# Holiday-regressor support — ships the per-country calendars used by
# the ``holidays`` regressor type. Lazy-imported by
# ``promforecast.regressors``; the module raises a clear error pointing
# operators at this extras install when the dependency is missing.
holidays = [
    "holidays>=0.50",
]
ha = [
    "kubernetes>=31.0",
    "redis>=5.1",
]
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "pandas-stubs>=2.2",
    # Pull the holiday extras into the dev environment so the
    # ``regressors.holidays`` tests have the dependency available.
    "holidays>=0.50",
]

[project.scripts]
promforecast = "promforecast.main:cli"

[project.entry-points."promforecast.models"]
auto_arima         = "promforecast.models.auto_arima:AutoARIMAModel"
auto_arima_damped  = "promforecast.models.auto_arima_damped:AutoARIMADampedModel"
auto_ets           = "promforecast.models.auto_ets:AutoETSModel"
auto_ets_damped    = "promforecast.models.auto_ets_damped:AutoETSDampedModel"
mstl               = "promforecast.models.mstl:MSTLModel"
seasonal_naive     = "promforecast.models.seasonal_naive:SeasonalNaiveModel"
# Intermittent-demand methods for sparse / count-shaped signals.
# Registered alongside the continuous-trend models so configs reference
# them by the same ``models:`` array — operators turn them on by
# adding the name, not by toggling a separate feature flag.
croston            = "promforecast.models.intermittent:CrostonModel"
croston_sba        = "promforecast.models.intermittent:CrostonSBAModel"
adida              = "promforecast.models.intermittent:ADIDAModel"
imapa              = "promforecast.models.intermittent:IMAPAModel"

[project.urls]
Homepage      = "https://github.com/esops-dev/promforecast"
Repository    = "https://github.com/esops-dev/promforecast"
Issues        = "https://github.com/esops-dev/promforecast/issues"
Documentation = "https://github.com/esops-dev/promforecast/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promforecast"]

# ---------- Tooling ----------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
    "PL",  # pylint
    "T20", # no print
]
ignore = ["PLR0913"]  # statsforecast wrappers naturally take many params

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # magic numbers are fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["statsforecast.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The official ``kubernetes`` Python client doesn't ship type stubs; the
# usual community ``types-kubernetes`` is incomplete and lags releases.
# Only the leader-election module reaches into the package, and it does
# so through a small typed wrapper, so ignoring the missing stubs is
# safer than chasing partial third-party stubs.
module = ["kubernetes", "kubernetes.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Same story for ``redis`` — only the async API is touched, and only
# inside thin wrappers that re-export a typed surface.
module = ["redis", "redis.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# OpenTelemetry SDK is an optional extra (``promforecast[otel]``). When
# tracing is disabled we never import the package, so stubs don't help.
# When tracing is enabled the imports live behind a thin facade in
# ``promforecast.telemetry`` that re-exposes the bits we use.
module = ["opentelemetry", "opentelemetry.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ``ruptures`` (change-point detection) and ``statsmodels.tsa.seasonal``
# (STL decomposition for the ``stl_residual`` outlier detector) are
# imported only inside ``promforecast.preprocess``. ``ruptures`` ships
# no type stubs; ``statsmodels`` ships partial stubs that don't cover
# the STL class we use. The preprocess module wraps both packages
# behind a narrow typed surface, so silencing missing imports here is
# the pragmatic fix.
module = ["ruptures", "statsmodels.tsa.seasonal"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The ``holidays`` package (optional extras dependency for the holiday
# regressor) ships partial stubs
# that don't cover ``country_holidays`` or the ``HolidayBase`` mapping
# API we use. The regressor module wraps it behind a thin lazy import
# so missing-imports silencing keeps mypy --strict clean.
module = ["holidays", "holidays.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
