[project]
name = "promforecast"
version = "0.0.0"
description = "Forecasts for Prometheus-compatible metrics, exposed as Prometheus metrics."
readme = "../README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "The promforecast Authors" }]
keywords = ["prometheus", "forecasting", "monitoring", "statsforecast", "victoriametrics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "prometheus-client>=0.21",
    "prometheus-api-client>=0.5",
    "statsforecast>=1.7",
    "pandas>=2.2",
    "numpy>=2.0",
    "apscheduler>=3.10",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=9.0",
]

[project.optional-dependencies]
ha = [
    "kubernetes>=31.0",
    "redis>=5.1",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "pandas-stubs>=2.2",
]

[project.scripts]
promforecast = "promforecast.main:cli"

[project.entry-points."promforecast.models"]
auto_arima     = "promforecast.models.auto_arima:AutoARIMAModel"
auto_ets       = "promforecast.models.auto_ets:AutoETSModel"
seasonal_naive = "promforecast.models.seasonal_naive:SeasonalNaiveModel"

[project.urls]
Homepage      = "https://github.com/esops-dev/promforecast"
Repository    = "https://github.com/esops-dev/promforecast"
Issues        = "https://github.com/esops-dev/promforecast/issues"
Documentation = "https://github.com/esops-dev/promforecast/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promforecast"]

# ---------- Tooling ----------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
    "PL",  # pylint
    "T20", # no print
]
ignore = ["PLR0913"]  # statsforecast wrappers naturally take many params

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # magic numbers are fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["statsforecast.*", "prometheus_api_client.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
